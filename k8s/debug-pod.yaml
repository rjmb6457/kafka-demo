apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
spec:
  containers:
    - name: debug
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: txn-data
          mountPath: /mnt/data
  volumes:
    - name: txn-data
      persistentVolumeClaim:
        claimName: data-pvc