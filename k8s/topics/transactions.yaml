apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-transactions
spec:
  template:
    spec:
      containers:
      - name: kafka-init
        image: bitnami/kafka:3.7.0
        command: ["bash", "-c"]
        args:
          - |
            kafka-topics.sh --create --if-not-exists \
              --topic transactions \
              --bootstrap-server kafka:9092 \
              --partitions 1 --replication-factor 1
      restartPolicy: OnFailure