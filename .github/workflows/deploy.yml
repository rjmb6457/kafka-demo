name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]   # Run workflow when code is pushed to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push consumer image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/consumer:latest ./consumer
        docker push ${{ secrets.DOCKER_USERNAME }}/consumer:latest

    - name: Build and push producer image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/producer:latest ./producer
        docker push ${{ secrets.DOCKER_USERNAME }}/producer:latest

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.27.0'

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/
