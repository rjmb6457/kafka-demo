name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]   # Run workflow when code is pushed to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout your repo
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Docker
    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    # Step 3: Log in to DockerHub
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 4: Build and push consumer image
    - name: Build and push consumer image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/consumer:latest -f consumer/Dockerfile .
        docker push ${{ secrets.DOCKER_USERNAME }}/consumer:latest

    # Step 5: Build and push producer image
    - name: Build and push producer image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/producer:latest -f producer/Dockerfile .
        docker push ${{ secrets.DOCKER_USERNAME }}/producer:latest

    # Step 6: Set up kubectl (Kubernetes CLI)
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.27.0'

    # Step 7: Deploy to Kubernetes
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/
